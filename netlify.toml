# Netlify settings for satvikshah.com
# The build step turns Markdown blog posts (content/blog) into pages and writes everything to dist/.
[build]
  command = "npm run build"
  publish = "dist"

# Send anyone who opens the Netlify address to the real domain.
[[redirects]]
  from = "https://satvikshah.netlify.app/*"
  to = "https://satvikshah.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
