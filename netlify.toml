# Netlify settings for satvikshah.com
# Static site: no build step. Netlify publishes the files in this folder as they are.
[build]
  publish = "."

# Send anyone who opens the Netlify address to the real domain.
[[redirects]]
  from = "https://satvikshah.netlify.app/*"
  to = "https://satvikshah.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
