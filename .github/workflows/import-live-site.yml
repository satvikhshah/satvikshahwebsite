name: Import live site (one-time)
on:
  push:
    paths: ['.github/workflows/import-live-site.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the published site from Netlify
        run: |
          set -euo pipefail
          base="https://satvikshah.netlify.app"
          for f in index.html favicon.svg robots.txt sitemap.xml \
                   img/hero.jpg img/polo.jpg img/candid.jpg img/full.jpg \
                   img/press-formal.jpg img/press-casual.jpg img/press-full.jpg; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL --retry 3 "$base/$f" -o "$f"
            echo "$f $(wc -c < "$f") bytes"
          done
      - name: Commit the site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.svg robots.txt sitemap.xml img
          git commit -m "Import live satvikshah.com site files from Netlify"
          git push
